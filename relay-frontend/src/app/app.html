<!-- Minimal shell — keeps your test harness card but now uses KeycloakService + environment.ts -->
<main class="d-flex justify-content-center align-items-center vh-100 bg-body-tertiary">
  <div class="card shadow-sm" style="width: 26rem">
    <div class="card-body text-center p-4">
      <h1 class="h3 mb-1">Relay</h1>
      <p class="text-body-secondary small mb-4">Auth flow test harness</p>

      @if (isAuthenticated()) {
        <p class="mb-1">Signed in as</p>
        <p class="fw-bold mb-3">{{ userName() || sub() }}</p>
        <p class="text-body-secondary small text-break">sub: {{ sub() }}</p>
        <div class="d-flex justify-content-center gap-2">
          <button type="button" class="btn btn-outline-secondary btn-sm" (click)="manageAccount()">Manage account</button>
          <button type="button" class="btn btn-outline-danger btn-sm" (click)="signOut()">Sign out</button>
        </div>
      } @else {
        <p class="text-body-secondary small mb-3">You are Guest — you can view public Notes without login.</p>
        <button type="button" class="btn btn-primary w-100" (click)="signIn()">Sign in / Register</button>
      }
    </div>
  </div>
</main>
<router-outlet />
