spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:relay}
    username: ${POSTGRES_USER:relay}
    password: ${POSTGRES_PASSWORD:relay}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL:http://localhost:9090}/realms/relay
  jpa:
    show-sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.relay: DEBUG
    org.springframework.security: DEBUG
