spring:
  application:
    name: relay-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates entities against it
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # hard backstop only — per-tier limits (10MB free / 50MB Pro, AC-15-02)
      # are enforced server-side in the upload path with localized errors.
      max-file-size: 50MB
      # attachment + up to 1MB note text + form overhead
      max-request-size: 52MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      # jobs run on schedule (Spring Batch), never at application boot
      enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# springdoc is enabled per-profile; prod disables UI and api-docs entirely (D-11)
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

relay:
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:9090}
    realm: relay
    # confidential service-account client used only for Admin API (account deletion)
    admin-client-id: ${KC_ADMIN_CLIENT_ID:relay-admin}
    admin-client-secret: ${KC_ADMIN_CLIENT_SECRET:change-me}
  email:
    api-key: ${RESEND_API_KEY:change-me}
    from-address: ${EMAIL_FROM:no-reply@relay.local}

logging:
  level:
    root: INFO
