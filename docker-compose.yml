name: relay

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    ports:
      - "5432:5432"
    volumes:
      # PG18+ images expect the mount at the parent dir (versioned subdir inside)
      - pgdata:/var/lib/postgresql
      # official-image init mechanism: runs once when the volume is first created
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.0
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    # --import-realm: imports realm JSON from /opt/keycloak/data/import at boot.
    # NOTE: import is skipped when the realm already exists — after editing
    # relay-keycloak/relay-realm.json, recreate the keycloak DB (see docs).
    command: start-dev --import-realm
    volumes:
      - ./relay-keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-relay}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      # KEYCLOAK_ADMIN* deprecated since KC26
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "9090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # image has no curl/wget — bash /dev/tcp against the mgmt port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./relay-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_HOST: postgres          # service name inside the compose network
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
      REDIS_HOST: redis
      # Must stay the BROWSER-facing URL: JWT 'iss' claims are minted from what
      # the browser used, and the backend validates issuer match. host-gateway
      # routes the container back out to your published port 9090.
      KEYCLOAK_SERVER_URL: http://host.docker.internal:9090
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID:-relay-admin}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:-change-me}
      RESEND_API_KEY: ${RESEND_API_KEY:-change-me}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@relay.local}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./relay-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:

